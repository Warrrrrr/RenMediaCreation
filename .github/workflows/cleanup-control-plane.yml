name: Cleanup Control Plane Diff

on:
  push:
    branches: ["agent/control-plane-hardening"]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-control-plane]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore target files from main
        run: |
          git fetch origin main
          git checkout origin/main -- main.py validator.py

      - name: Reapply only Claim Register changes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text()

          text = text.replace(
              '    QuotaExceededError,\n)\n',
              '    QuotaExceededError,\n)\nfrom claim_pipeline import extract_claim_register\n',
              1,
          )
          text = text.replace(
              'validator_module = importlib.import_module("validator")\n',
              'validator_module = importlib.import_module("validator")\ncontrol_plane_module = importlib.import_module("control_plane")\n',
              1,
          )
          text = text.replace(
              '    strategy_map,\n    length_minutes,\n):',
              '    strategy_map,\n    length_minutes,\n    claim_register=None,\n):',
              1,
          )
          text = text.replace(
              '        "governance": governance_text,\n        "governance_rules": governance_text,\n',
              '        "governance": governance_text,\n        "governance_rules": governance_text,\n        "claim_register": claim_register,\n        "claims": claim_register,\n',
              1,
          )
          text = text.replace(
              'APPROVED STRATEGY MAP:\n{strategy_map}\n\nGOVERNANCE:',
              'APPROVED STRATEGY MAP:\n{strategy_map}\n\nCLAIM REGISTER:\n{claim_register}\n\nTreat the claim register as the evidence boundary. Do not upgrade\nsource claims into independently verified facts.\n\nGOVERNANCE:',
              1,
          )
          text = text.replace(
              'APPROVED OUTLINE:\n{outline}\n\nGOVERNANCE:',
              'APPROVED OUTLINE:\n{outline}\n\nCLAIM REGISTER:\n{claim_register}\n\nTreat the claim register as the evidence boundary. Do not upgrade\nsource claims into independently verified facts.\n\nGOVERNANCE:',
              1,
          )
          text = text.replace(
              '        return page(\n            f"""\n            <p class=\'critical\'>\n              No source material was supplied.\n            </p>\n            """\n        )\n\n    analysis_topic = (',
              '        return page(\n            f"""\n            <p class=\'critical\'>\n              No source material was supplied.\n            </p>\n            """\n        )\n\n    try:\n        claim_register = extract_claim_register(source_context)\n    except Exception as exc:\n        return page(\n            f"""\n            <p class=\'critical\'>\n              Claim Register extraction failed:\n              {esc(exc)}\n            </p>\n            """\n        )\n\n    analysis_topic = (',
              1,
          )
          text = text.replace(
              '          value="{esc(source_context)}"\n        >\n\n        <input\n          type="hidden"\n          name="creative_direction"',
              '          value="{esc(source_context)}"\n        >\n\n        <input\n          type="hidden"\n          name="claim_register"\n          value="{esc(_json_safe(claim_register))}"\n        >\n\n        <input\n          type="hidden"\n          name="creative_direction"',
              1,
          )
          text = text.replace(
              '    source_context: str = Form(""),\n    creative_direction: str = Form(""),',
              '    source_context: str = Form(""),\n    claim_register: str = Form("{}"),\n    creative_direction: str = Form(""),',
              1,
          )
          marker = '    word_target = int(\n        length * WORDS_PER_MINUTE\n    )\n\n'
          validation = marker + '''    try:\n        claim_register_data = json.loads(claim_register or "{}")\n        claims = (\n            claim_register_data.get("claims", [])\n            if isinstance(claim_register_data, dict)\n            else []\n        )\n        control_plane_module.build_claim_register(claims)\n    except Exception as exc:\n        return page(\n            f"""\n            <p class='critical'>\n              Claim Register validation failed:\n              {esc(exc)}\n            </p>\n            """\n        )\n\n'''
          if text.count(marker) < 1:
              raise SystemExit('strategy-map word_target marker not found')
          text = text.replace(marker, validation, 1)
          text = text.replace(
              '        strategy_map=strategy_map,\n        governance=governance_text,',
              '        strategy_map=strategy_map,\n        claim_register=claim_register,\n        governance=governance_text,',
              1,
          )
          text = text.replace(
              '          value="{esc(source_context)}"\n          >\n\n          <input\n            type="hidden"\n            name="creative_direction"',
              '          value="{esc(source_context)}"\n          >\n\n          <input\n            type="hidden"\n            name="claim_register"\n            value="{esc(claim_register)}"\n          >\n\n          <input\n            type="hidden"\n            name="creative_direction"',
              1,
          )
          text = text.replace(
              '    source_context: str = Form(""),\n    creative_direction: str = Form(""),',
              '    source_context: str = Form(""),\n    claim_register: str = Form("{}"),\n    creative_direction: str = Form(""),',
              1,
          )
          validation2 = marker + '''    try:\n        claim_register_data = json.loads(claim_register or "{}")\n        claims = (\n            claim_register_data.get("claims", [])\n            if isinstance(claim_register_data, dict)\n            else []\n        )\n        control_plane_module.build_claim_register(claims)\n    except Exception as exc:\n        return page(\n            f"""\n            <p class='critical'>\n              Claim Register validation failed:\n              {esc(exc)}\n            </p>\n            """\n        )\n\n'''
          if marker in text:
              text = text.replace(marker, validation2, 1)
          text = text.replace(
              '        strategy_map=strategy_map,\n        outline=outline,\n        governance=governance_text,',
              '        strategy_map=strategy_map,\n        outline=outline,\n        claim_register=claim_register,\n        governance=governance_text,',
              1,
          )
          text = text.replace(
              '            strategy_map=strategy_map,\n            length_minutes=length,\n        )',
              '            strategy_map=strategy_map,\n            length_minutes=length,\n            claim_register=claim_register,\n        )',
              1,
          )

          main.write_text(text)

          validator = Path('validator.py')
          text = validator.read_text()
          text = text.replace(
              'import json\nimport re\n\n',
              'import json\nimport re\n\nfrom claim_register import validate_claim_register, ClaimRegister\n\n',
              1,
          )
          helper = '''\n\ndef _validate_claim_register_payload(claim_register):\n    """Validate the claim register without deciding whether claims are true."""\n    if claim_register is None:\n        return []\n\n    if isinstance(claim_register, str):\n        try:\n            claim_register = json.loads(claim_register)\n        except json.JSONDecodeError as exc:\n            raise ValueError("Claim register must be valid JSON.") from exc\n\n    if not isinstance(claim_register, dict):\n        raise ValueError("Claim register must be a JSON object.")\n\n    claims = claim_register.get("claims", [])\n    if not isinstance(claims, list):\n        raise ValueError("Claim register claims must be a list.")\n\n    register = ClaimRegister(claims)\n    errors = validate_claim_register(register)\n    if errors:\n        raise ValueError("Invalid claim register: " + " | ".join(errors))\n\n    return []\n'''
          needle = '\n\n# =============================================================================\n# VALIDATION PROMPT\n# =============================================================================\n'
          text = text.replace(needle, helper + needle, 1)
          text = text.replace(
              '{script}\n\n============================================================\nGOVERNANCE',
              '{script}\n\n============================================================\nSOURCE CLAIM REGISTER\n============================================================\n\n{claim_register}\n\nThe Claim Register distinguishes what a supplied source says from what has been\nindependently verified. Treat independent verification marked "unknown" as unknown.\nDo not classify a source-supported claim as an independently verified fact.\n\n============================================================\nGOVERNANCE',
              1,
          )
          text = text.replace(
              '    target_minutes=None,\n):',
              '    target_minutes=None,\n    claim_register=None,\n):',
              1,
          )
          text = text.replace(
              '    if target_minutes is not None:\n        length_minutes = target_minutes\n\n    prompt = VALIDATION_PROMPT_TEMPLATE.format(',
              '    if target_minutes is not None:\n        length_minutes = target_minutes\n\n    _validate_claim_register_payload(claim_register)\n    claim_text = _json_safe(claim_register or {"claims": [], "policy": {}})\n\n    prompt = VALIDATION_PROMPT_TEMPLATE.format(',
              1,
          )
          text = text.replace(
              '        script=script,\n        governance=governance,',
              '        script=script,\n        claim_register=claim_text,\n        governance=governance,',
              1,
          )
          validator.write_text(text)
          PY

      - name: Verify diff is limited to intended files
        run: git diff --check

      - name: Commit cleaned files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py validator.py
          git commit -m "Clean Claim Register control-plane diff" || exit 0
          git push
