name: Wire Strategy Boundary

on:
  push:
    branches: ["agent/control-plane-hardening"]

permissions:
  contents: write

jobs:
  wire:
    if: contains(github.event.head_commit.message, '[wire-strategy-boundary]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text()
          old = '''    try:\n        claim_register_data = json.loads(claim_register or "{}")\n        claims = claim_register_data.get("claims", []) if isinstance(claim_register_data, dict) else []\n        control_plane_module.build_claim_register(claims)\n    except Exception as exc:\n'''
          new = '''    try:\n        control_plane_module.validate_approved_strategy_map(strategy_map)\n        claim_register_data = json.loads(claim_register or "{}")\n        claims = claim_register_data.get("claims", []) if isinstance(claim_register_data, dict) else []\n        control_plane_module.build_claim_register(claims)\n    except Exception as exc:\n'''
          if text.count(old) != 2:
              raise SystemExit(f'expected two validation blocks, found {text.count(old)}')
          text = text.replace(old, new, 2)
          p.write_text(text)
          PY
      - name: Add regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test_control_plane.py')
          text = p.read_text()
          needle = '''    def test_validator_accepts_valid_claim_register(self):\n'''
          test = '''    def test_strategy_boundary_rejects_unknown_edited_map(self):\n        with self.assertRaises(ValueError):\n            from control_plane import validate_approved_strategy_map\n            validate_approved_strategy_map({"selected_strategy_ids": ["not_a_real_strategy"]})\n\n'''
          if 'test_strategy_boundary_rejects_unknown_edited_map' not in text:
              text = text.replace(needle, test + needle, 1)
          p.write_text(text)
          PY
      - name: Test and remove temporary workflow
        run: |
          python -m unittest -v test_control_plane.py
          rm .github/workflows/wire-strategy-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py test_control_plane.py .github/workflows/wire-strategy-boundary.yml
          git commit -m "Enforce approved strategy boundary"
          git push
