name: Control Plane Tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run control-plane tests
        run: python -m unittest -v test_control_plane.py
