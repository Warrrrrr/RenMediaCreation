name: Control Plane Tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run control-plane tests
        run: |
          set +e
          python -m unittest -v test_control_plane.py 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-test-output
          path: test-output.txt
