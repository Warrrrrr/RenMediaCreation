name: Fix Validation Message

on:
  push:
    branches: ["agent/control-plane-hardening"]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-validation-message]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text()
          old = '''    except Exception as exc:\n        return page(\n            f"""\n            <p class='critical'>\n              Claim Register validation failed:\n              {esc(exc)}\n            </p>\n            """\n        )\n'''
          new = '''    except Exception as exc:\n        return page(\n            f"""\n            <p class='critical'>\n              Control-plane validation failed:\n              {esc(exc)}\n            </p>\n            """\n        )\n'''
          if text.count(old) != 2:
              raise SystemExit(f'expected two blocks, found {text.count(old)}')
          p.write_text(text.replace(old, new, 2))
          PY
          python -m unittest -v test_control_plane.py
          rm .github/workflows/fix-validation-message.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/fix-validation-message.yml
          git commit -m "Clarify control-plane validation error" 
          git push
